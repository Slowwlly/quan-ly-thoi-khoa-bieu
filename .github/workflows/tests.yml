
name: Kiem thu he thong quan ly thoi khoa bieu

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v5

      - name: Cai dat Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cai dat thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Kiem tra cu phap
        run: python -m compileall -q app.py tkb tests

      - name: Chay kiem thu
        run: |
          python -m pytest -v --cov=tkb --cov=app --cov-report=term-missing
